<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>대구 버스·지하철 검색</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#1b1d21;--sub:#6b7280;--bd:#e3e5e9;--ac:#2563eb}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121316;--card:#1c1e23;--tx:#eceef1;--sub:#9aa1ac;--bd:#2c2f36;--ac:#6ea0ff}}
:root[data-theme="dark"]{--bg:#121316;--card:#1c1e23;--tx:#eceef1;--sub:#9aa1ac;--bd:#2c2f36;--ac:#6ea0ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;max-width:560px;margin-inline:auto;padding:14px}
h1{font-size:19px;margin:4px 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:15px}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
input{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:15px;margin-bottom:8px}
.row{display:flex;gap:8px}
.go{width:100%;padding:11px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{padding:5px 12px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:13px}
.chip.on{color:#fff;border-color:transparent}
.badge{display:inline-block;color:#fff;border-radius:99px;padding:1px 9px;font-size:12px;margin-right:4px}
.st{padding:9px 4px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.st:last-child{border:0}
.sub{color:var(--sub);font-size:13px}
.seg{padding:8px 0;border-bottom:1px dashed var(--bd)}
a.btn{display:block;text-align:center;padding:11px;border-radius:10px;border:1px solid var(--bd);color:var(--ac);text-decoration:none;margin-top:8px}
.list{max-height:46vh;overflow-y:auto}
</style>
</head>
<body>
<h1>🚇 대구 버스·지하철</h1>
<div class="tabs"><button id="tS" class="on">지하철</button><button id="tB">버스</button></div>

<div id="pS">
  <div class="card">
    <input id="from" list="dl" placeholder="출발역" autocomplete="off">
    <input id="to" list="dl" placeholder="도착역" autocomplete="off">
    <datalist id="dl"></datalist>
    <button class="go" id="find">경로 찾기</button>
    <div id="res"></div>
  </div>
  <div class="card">
    <div class="chips" id="chips"></div>
    <input id="q" placeholder="역 이름 검색">
    <div class="list" id="list"></div>
  </div>
</div>

<div id="pB" hidden>
  <div class="card">
    <input id="bq" placeholder="버스 번호 또는 정류장 이름 (예: 급행1, 동대구역)">
    <a class="btn" id="bn" target="_blank" rel="noopener">네이버 지도로 열기</a>
    <a class="btn" href="https://businfo.daegu.go.kr" target="_blank" rel="noopener">대구시 공식 사이트 바로가기</a>
  </div>
</div>

<script>
const LINES={
 "1호선":{c:"#e8202a",s:["설화명곡","화원","대곡","진천","월배","상인","월촌","송현","서부정류장","대명","안지랑","현충로","영대병원","교대","명덕","반월당","중앙로","대구역","칠성시장","신천","동대구역","큰고개","아양교","동촌","해안","방촌","용계","율하","신기","반야월","각산","안심","대구한의대병원","부호","하양"]},
 "2호선":{c:"#00a651",s:["문양","다사","대실","강창","계명대","성서산업단지","이곡","용산","죽전","감삼","두류","내당","반고개","청라언덕","반월당","경대병원","대구은행","범어","수성구청","만촌","담티","연호","대공원","고산","신매","사월","정평","임당","영남대"]},
 "3호선":{c:"#e89b00",s:["칠곡경대병원","학정","팔거","동천","칠곡운암","구암","태전","매천","매천시장","팔달","공단","만평","팔달시장","원대","북구청","달성공원","명덕","신남","희망교","수성시장","수성구민운동장","어린이회관","황금","수성못","지산","범물","용지"]}
};
const $=id=>document.getElementById(id);
const adj={},info={};
for(const [ln,o] of Object.entries(LINES)){
  o.s.forEach((n,i)=>{
    (info[n]=info[n]||[]).push(ln);
    adj[n]=adj[n]||[];
    if(i>0){adj[n].push({to:o.s[i-1],ln});adj[o.s[i-1]].push({to:n,ln});}
  });
}
const names=Object.keys(info).sort((a,b)=>a.localeCompare(b,'ko'));
$("dl").innerHTML=names.map(n=>`<option value="${n}">`).join("");
const badge=ln=>`<span class="badge" style="background:${LINES[ln].c}">${ln}</span>`;

// tabs
$("tS").onclick=()=>{$("pS").hidden=false;$("pB").hidden=true;$("tS").classList.add("on");$("tB").classList.remove("on")};
$("tB").onclick=()=>{$("pS").hidden=true;$("pB").hidden=false;$("tB").classList.add("on");$("tS").classList.remove("on")};

// station list
let cur="전체",pick=0;
function chips(){
  $("chips").innerHTML=["전체",...Object.keys(LINES)].map(l=>{
    const on=l===cur,bg=on&&l!=="전체"?LINES[l].c:"var(--ac)";
    return `<button class="chip ${on?"on":""}" style="${on?"background:"+bg:""}" data-l="${l}">${l}</button>`}).join("");
  document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{cur=b.dataset.l;chips();draw()});
}
function draw(){
  const q=$("q").value.trim();
  let out="";
  const lines=cur==="전체"?Object.keys(LINES):[cur];
  for(const ln of lines){
    const arr=LINES[ln].s.filter(n=>n.includes(q));
    if(!arr.length)continue;
    out+=`<div style="margin:8px 0 2px">${badge(ln)}</div>`;
    out+=arr.map(n=>{
      const tr=info[n].filter(x=>x!==ln).map(badge).join("");
      return `<div class="st" data-n="${n}"><span>${n}</span><span>${tr?"환승 "+tr:""}</span></div>`}).join("");
  }
  $("list").innerHTML=out||'<p class="sub">검색 결과가 없습니다.</p>';
  document.querySelectorAll(".st").forEach(e=>e.onclick=()=>{
    const t=pick%2?$("to"):$("from");t.value=e.dataset.n;pick++;
    if($("from").value&&$("to").value)find();
  });
}
$("q").oninput=draw;

// route (BFS, 최소 정차역)
function find(){
  const a=$("from").value.trim(),b=$("to").value.trim(),r=$("res");
  if(!info[a]||!info[b]){r.innerHTML='<p class="sub">목록에 있는 역 이름을 입력해 주세요.</p>';return}
  if(a===b){r.innerHTML='<p class="sub">출발역과 도착역이 같습니다.</p>';return}
  const prev={[a]:null},q=[a];
  while(q.length){const n=q.shift();if(n===b)break;
    for(const e of adj[n])if(!(e.to in prev)){prev[e.to]={from:n,ln:e.ln};q.push(e.to)}}
  const path=[];let n=b;
  while(prev[n]){path.push({n,ln:prev[n].ln});n=prev[n].from}
  path.reverse();
  const segs=[];let s=a,ln=path[0].ln,cnt=0,last=a;
  for(const p of path){
    if(p.ln!==ln){segs.push({ln,s,e:last,cnt});s=last;ln=p.ln;cnt=0}
    cnt++;last=p.n;
  }
  segs.push({ln,s,e:last,cnt});
  const tot=path.length;
  r.innerHTML=`<p style="margin:12px 0 4px"><b>총 ${tot}개 역 · 환승 ${segs.length-1}회</b> <span class="sub">(약 ${Math.round(tot*2.3)}분 예상)</span></p>`+
    segs.map(g=>`<div class="seg">${badge(g.ln)} ${g.s} → ${g.e} <span class="sub">(${g.cnt}개 역)</span></div>`).join("");
}
$("find").onclick=find;

// bus
function bus(){
  const q=encodeURIComponent("대구 "+($("bq").value.trim()||"버스"));
  $("bn").href="https://map.naver.com/p/search/"+q;
}
$("bq").oninput=bus;
bus();chips();draw();
</script>
</body>
</html>
